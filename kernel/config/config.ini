[machine]
num_cpu = 2
cpu_num_cores = 4
cpu_clock_speed_Ghz = 1
cpu_hardware_threads = 8
cpu_cache_L1 = 32KB
cpu_cache_L2 = 256KB
cpu_cache_L3 = 8MB

[scheduler]
replacement_policy = Economical
scheduler_tick_freq = 4 ; 0 es el valor por defecto del sistema operativo, cpu_clock_speed_Ghz
bucket_cgs_granularity = 5 ; la cantidad de scalones fiscales (en cgs) en los que se divide la sociedad
max_budget = 30000 ; presupuesto máximo (en cgs) asignable a un proceso