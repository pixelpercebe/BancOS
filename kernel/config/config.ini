[machine]
num_cpu = 1
cpu_num_cores = 2
cpu_clock_speed_Ghz = 1
cpu_hardware_threads = 4
cpu_cache_L1 = 32KB
cpu_cache_L2 = 256KB
cpu_cache_L3 = 8MB

[scheduler]
scheduler_tick_freq = 4 ; 0 es el valor por defecto del sistema operativo, cpu_clock_speed_Ghz
bucket_cgs_granularity = 100 ; la cantidad de tramos fiscales (en cgs) en los que se divide la sociedad
max_budget = 30000 ; presupuesto máximo (en cgs) asignable a un proceso